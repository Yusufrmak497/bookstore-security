<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bookstore Reviews</title>
</head>
<body>
  <h1>Reviews</h1>
  <div id="reviews"></div>
  <script>
    // Review text is untrusted (stored user input): render it with textContent
    // only, never as HTML (CWE-79).
    async function load(bookId) {
      const res = await fetch('/reviews/' + encodeURIComponent(bookId));
      const reviews = await res.json();
      const box = document.getElementById('reviews');
      const nodes = reviews.map(t => {
        const p = document.createElement('p');
        p.textContent = String(t);
        return p;
      });
      box.replaceChildren(...nodes);
    }
    load(1);
  </script>
</body>
</html>
